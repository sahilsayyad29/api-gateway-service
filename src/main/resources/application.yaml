server:
  port: 8080

spring:
  application:
    name: api-gateway-service

  cloud:
    gateway:
      routes:
        - id: user-kyc-service
          # Matches the spring.application.name registered in Eureka (Case-Insensitive)
          uri: lb://USER-KYC-SERVICE
          predicates:
            - Path=/api/v1/users/**, /api/v1/kyc/**

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}